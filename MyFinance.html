<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MyFinance</title>

  <style>
/* Layout: one phone-width column, hero figure on top, bottom tab bar, bottom sheets for every form. */
:root{
  color-scheme:light;
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#E8EFEE; --ink:#0E2526; --ink2:#41585A; --muted:#5B7173; --line:#D9E3E2;
  --accent:#0B6B5D; --accent-ink:#FFFFFF; --pos:#0B7A58; --neg:#B83A28;
  --hero-bg:#0B2B2D; --hero-ink:#EAF6F2; --hero-soft:#9FBDB8; --hero-accent:#7FE0BB; --hero-neg:#FFB4A5; --hero-line:#25484A;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c-other:#8A9A9C;
  --g-housing:var(--c1); --g-insurance:var(--c2); --g-loan:var(--c3); --g-inst:var(--c4);
  --g-groceries:var(--c5); --g-transport:var(--c6); --g-leisure:var(--c7); --g-other:var(--c-other);
  --font-display:"Bricolage Grotesque",system-ui,sans-serif; --font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(14,37,38,.06),0 6px 20px rgba(14,37,38,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1415; --surface:#112123; --surface2:#182E30; --ink:#E7F1EF; --ink2:#B7CBC9; --muted:#8FA8A6; --line:#223B3D;
  --accent:#4CC9A5; --accent-ink:#06201A; --pos:#4CC9A5; --neg:#F0806C;
  --hero-bg:#0F3033; --hero-line:#2C5456;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c-other:#7C8E90;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1415; --surface:#112123; --surface2:#182E30; --ink:#E7F1EF; --ink2:#B7CBC9; --muted:#8FA8A6; --line:#223B3D;
  --accent:#4CC9A5; --accent-ink:#06201A; --pos:#4CC9A5; --neg:#F0806C;
  --hero-bg:#0F3033; --hero-line:#2C5456;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c-other:#7C8E90;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:110px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font:700 20px/1 var(--font-display);letter-spacing:-.2px}.brand i{font-style:normal;color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:20px;height:20px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
.mlabel{font:600 17px/1.2 var(--font-display);text-transform:capitalize;text-align:center;flex:1}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:22px 20px 18px}
.hero .lab{font-size:13px;color:var(--hero-soft);letter-spacing:.04em;text-transform:uppercase}
.hero .big{font:700 clamp(38px,12vw,54px)/1.05 var(--font-display);letter-spacing:-1.5px;margin:8px 0 4px;color:var(--hero-accent);white-space:nowrap}
.hero .big.neg{color:var(--hero-neg)}
.hero .hint{font-size:13px;color:var(--hero-soft)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--hero-line);padding-top:14px;gap:10px}
.hstats div{min-width:0}.hstats .k{font-size:12px;color:var(--hero-soft)}.hstats .v{font:600 15px/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2,.sec h2{font:650 16px/1.25 var(--font-display);margin:0 0 12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.sec h2{margin:0;font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.stack{display:flex;height:14px;gap:2px;border-radius:7px;overflow:hidden;background:var(--surface2);margin-bottom:12px}
.stack span{display:block;min-width:3px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font:600 15px/1.2 var(--font-display);white-space:nowrap;text-align:right}
button.row{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayh{font-size:12.5px;color:var(--muted);text-transform:capitalize;margin:16px 2px 4px;letter-spacing:.02em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 16px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--neg)}
.cm{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cm:first-of-type{margin-top:0;padding-top:0;border-top:0}
.cm .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cm .hd b{font:650 16px/1.25 var(--font-display)}
.cm .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:6px 0 8px}
.cm .acts{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--ink2);margin-left:6px;vertical-align:middle}
.lim{display:flex;align-items:center;gap:10px}
.lim input{width:104px;text-align:right}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;font-size:16px}
textarea{height:96px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.fld{display:block;margin:12px 0}.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-weight:500}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.preview{background:var(--surface2);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.preview div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.err{color:var(--neg);font-size:13.5px;min-height:20px;margin:4px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:12px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar button.addtab{align-self:center;justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);margin-top:-20px;padding:0;justify-content:center;box-shadow:0 8px 20px rgba(11,107,93,.35)}
.addtab svg{width:26px;height:26px;stroke-width:2.2}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,18,19,.55)}
.panel{position:relative;background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sh-head h2{font:650 20px/1.2 var(--font-display);margin:0}
.kinds{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.kind{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:14px;font-weight:500}
.kind.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.acts2{display:flex;gap:10px;margin-top:14px}.acts2>*{flex:1}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin:8px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{font-size:13.5px;color:var(--ink2);min-height:22px;margin-bottom:4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:10px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.hit{fill:transparent}
.chart g.sel rect.hit{fill:var(--surface2);opacity:.6}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tblw{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.kv:first-child{border-top:0}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin:22px 8px 0}
</style>

function detectLang(){const l=(navigator.language||'tr').slice(0,2);return l==='de'?'de':l==='en'?'en':'tr'}
function migrate(o){
  const ns={v:2,lang:o.lang||'tr',currency:o.currency||'EUR',items:[],budgets:{},goals:[],demo:false};
  const first=ymd(new Date(new Date().getFullYear(),new Date().getMonth(),1));
  for(const e of (o.entries||[])){
    const base={id:uid(),name:e.name||'',};
    if(['income','expense','housing','savings'].includes(e.type))ns.items.push({...base,kind:'tx',type:e.type,cat:e.type==='expense'?'other':undefined,amount:+e.amount||0,date:e.date});
    else if(e.type==='insurance')ns.items.push({...base,kind:'rec',type:'insurance',amount:+e.amount||0,every:'month',start:e.date,end:''});
    else if(e.type==='loan')ns.items.push({...base,kind:'loan',lender:e.lender||'',principal:+e.amount||0,rate:+e.rate||0,months:+e.months||1,start:e.firstInstallmentDate||e.date,paidOff:!!e.paidOff,paidOffDate:e.paidOffDate||''});
    else if(e.type==='installment')ns.items.push({...base,kind:'inst',total:+e.totalRepayment||+e.amount||0,months:+e.months||1,start:e.firstInstallmentDate||e.date});
  }
  for(const r of (o.recurring||[]))ns.items.push({id:uid(),kind:'rec',type:'expense',cat:'other',name:r.name,amount:+r.amount||0,every:'month',start:first,end:''});
  for(const g of (o.goals||[]))ns.goals.push({id:uid(),name:g.name,target:+g.target||0,saved:+g.saved||0});
  const b=o.budgets||{};if(b.housing)ns.budgets.housing=b.housing;if(b.other)ns.budgets.other=b.other;
  return ns;
}

/* ---------- engine: one source of truth for every number ---------- */
function loanCalc(P,rate,n){n=Math.max(1,Math.round(n));const r=Math.pow(1+Math.max(0,rate)/100,1/12)-1;const p=r===0?P/n:P*r/(1-Math.pow(1+r,-n));return{pay:p,total:p*n,interest:p*n-P}}
const payOf=it=>it.kind==='loan'?loanCalc(it.principal,it.rate,it.months).pay:it.total/it.months;
function occ(y,m){
  const out=[];
  for(const it of S.items){
    const mk=(type,cat,amount,date,auto)=>out.push({id:it.id,name:it.name,type,cat,amount,date,auto});
    if(it.kind==='tx'){const d=pd(it.date);if(d.getFullYear()===y&&d.getMonth()===m)mk(it.type,it.cat,it.amount,d,false)}
    else if(it.kind==='rec'){
      const st=pd(it.start),diff=(y-st.getFullYear())*12+(m-st.getMonth());
      if(diff<0||(it.every==='year'&&diff%12))continue;
      const d=addM(it.start,diff);if(it.end&&d>pd(it.end))continue;
      mk(it.type,it.cat,it.amount,d,true);
    }else{
      const st=pd(it.start),diff=(y-st.getFullYear())*12+(m-st.getMonth());
      if(diff<0||diff>=it.months)continue;
      const d=addM(it.start,diff);if(it.paidOff&&it.paidOffDate&&d>pd(it.paidOffDate))continue;
      mk(it.kind,null,payOf(it),d,true);
    }
  }
  return out;
}
const GROUPS=['housing','insurance','loan','inst','groceries','transport','leisure','other'];
const gkey=x=>x.type==='expense'?(GROUPS.includes(x.cat)?x.cat:'other'):x.type;
function totals(y,m){
  const list=occ(y,m),g={};GROUPS.forEach(k=>g[k]=0);let inc=0,sav=0,spend=0;
  for(const x of list){
    if(x.type==='income')inc+=x.amount;else if(x.type==='savings')sav+=x.amount;else{spend+=x.amount;g[gkey(x)]+=x.amount}
  }
  return{list,inc,sav,spend,left:inc-spend-sav,g};
}
function progress(it){
  const n=it.months,monthly=payOf(it),total=it.kind==='loan'?monthly*n:it.total,today=pd(ymd(new Date()));
  let paid=0;if(it.paidOff)paid=n;else for(let k=0;k<n;k++){if(addM(it.start,k)<=today)paid++;else break}
  return{paid,n,monthly,total,remaining:it.paidOff?0:Math.max(0,total-paid*monthly)};
}

function upcoming(){

}

  if(kind!=='loan'){
    for(let d=new Date(2000,0,1);d<=new Date(2100,11,1);d.setMonth(d.getMonth()+1)){
      const y=d.getFullYear(),m=d.getMonth();
      const list=occ(y,m);
      for(const x of list){
        if(from&&x.date<from)continue;
        if(to&&x.date>to)continue;
        if(kind==='income'&&x.type!=='income')continue;
        if(kind==='savings'&&x.type!=='savings')continue;
        if(kind==='expense'&&['income','savings'].includes(x.type))continue;
       if(kind==='savings'){
  rows.push(`<tr>
    <td>${esc(x.name)}</td>
    <td>Sparen</td>
    <td>${money(x.amount)}</td>
  </tr>`);
}else{
  rows.push(`<tr>
    <td>${esc(x.date)}</td>
    <td>${esc(x.name)}</td>
    <td>${esc(x.type)}</td>
    <td>${money(x.amount)}</td>
  </tr>`);
}
      }
    }
  }

  const loanTable=loans.length?`
    <h2>Kredite und Raten</h2>
    <table><tr><th>Name</th><th>Gesamt</th><th>Monatlich</th><th>Bezahlt</th><th>Offen</th></tr>
    ${loans.join('')}</table>`:'';

  const dataTable=rows.length?`
    <h2>Einträge</h2>
    <table>
    <tr>${kind==='savings'
      ? '<th>Name</th><th>Art</th><th>Betrag</th>'
      : '<th>Datum</th><th>Name</th><th>Art</th><th>Betrag</th>'}
    </tr>
    ${rows.join('')}</table>`:'<p>Keine Einträge gefunden.</p>';

  document.getElementById('printArea').innerHTML=`
    <h1>MyFinance Plus</h1>
    <p>Bericht: ${esc(kind)}</p>
    <p>Zeitraum: ${from||'Alle'} – ${to||'Alle'}</p>
    ${loanTable}${dataTable}`;

  if(window.Android&&Android.printPdf) Android.printPdf();
  else alert('PDF-Funktion ist noch nicht eingerichtet.');
}

function vReport(){
  const months=[];
  for(let i=0;i<12;i++)months.push({i,...totals(RY,i)});
  const ti=months.reduce((a,x)=>a+x.inc,0);
  const ts=months.reduce((a,x)=>a+x.spend,0);
  const tv=months.reduce((a,x)=>a+x.sav,0);
  const gt={};
  GROUPS.forEach(k=>gt[k]=months.reduce((a,x)=>a+x.g[k],0));

  let h=mnav(String(RY),'yprev','ynext');

  h+=`<section class="card">
    <h2>PDF Export / PDF Dışa Aktarma</h2>
    <label class="fld">
      <span>Bericht / Rapor türü</span>
      <select id="pdf-kind">
        <option value="all">Alle Daten / Tüm veriler</option>
        <option value="loan">Kredite / Krediler</option>
        <option value="savings">Sparen / Birikimler</option>
        <option value="income">Einnahmen / Gelirler</option>
        <option value="expense">Ausgaben / Giderler</option>
      </select>
    </label>
    <div class="two">
      <label class="fld">
        <span>Von / Başlangıç</span>
        <input id="pdf-from" type="date">
      </label>
      <label class="fld">
        <span>Bis / Bitiş</span>
        <input id="pdf-to" type="date">
      </label>
    </div>
    <button class="btn primary block" data-act="pdfexport">
      PDF erstellen / PDF oluştur
    </button>
  </section>`;

  h+=`<section class="card" style="margin-top:0">
    <h2>${t('r_title')}</h2>
    <div class="kv"><span>${t('income')}</span><b class="num pos">${money(ti)}</b></div>
    <div class="kv"><span>${t('spend')}</span><b class="num">${money(ts)}</b></div>
    <div class="kv"><span>${t('savings')}</span><b class="num">${money(tv)}</b></div>
    <div class="kv"><span>${t('net')}</span><b class="num ${ti-ts-tv<0?'neg':''}">${money(ti-ts-tv)}</b></div>
  </section>`;

  h+=`<section class="card">
    <div class="sh-head" style="margin-bottom:4px">
      <h2 style="margin:0">${t('r_chart')}</h2>
      <button class="btn sm" data-act="tbl">${showTable?t('r_chart_b'):t('r_table')}</button>
    </div>`;

  if(showTable){
    h+=`<div class="tblw"><table class="tbl">
      <thead><tr><th>${t('month')}</th><th>${t('income')}</th><th>${t('spend')}</th><th>${t('net')}</th></tr></thead>
      <tbody>${months.map(x=>`<tr>
        <td>${dfmt(new Date(RY,x.i,1),{month:'short'})}</td>
        <td class="num">${money(x.inc)}</td>
        <td class="num">${money(x.spend)}</td>
        <td class="num">${money(x.inc-x.spend-x.sav)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }else{
    const W=360,H=190,L=38,B=22,Tp=8,pw=W-L-4,ph=H-B-Tp;
    const max=Math.max(1,...months.flatMap(x=>[x.inc,x.spend]));
    const step=niceStep(max/4),top=step*4,bw=pw/12,w=Math.min(11,bw/2-2);
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('r_chart')}">`;
    for(let i=0;i<=4;i++){
      const y=Tp+ph-ph*i/4;
      s+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${compact(step*i)}</text>`;
    }
    const bar=(x,v,col)=>{
      const hh=Math.max(0,v/top*ph);
      if(hh<=0)return'';
      const r=Math.min(4,hh,w/2),y=Tp+ph-hh;
      return `<path d="M${x},${Tp+ph}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${Tp+ph}Z" fill="${col}"/>`;
    };
    months.forEach((x,i)=>{
      const cx=L+bw*i+bw/2;
      s+=`<g data-m="${i}" class="${i===V.m&&RY===V.y?'sel':''}">
        <rect class="hit" x="${L+bw*i}" y="${Tp}" width="${bw}" height="${ph+B}"/>
        ${bar(cx-w-1,x.inc,'var(--c1)')}
        ${bar(cx+1,x.spend,'var(--c2)')}
        <text x="${cx}" y="${H-6}" text-anchor="middle">${esc(dfmt(new Date(RY,i,1),{month:'short'}).replace('.',''))}</text>
      </g>`;
    });
    s+='</svg>';
    h+=`<div class="legend">
      <span><i style="background:var(--c1)"></i>${t('income')}</span>
      <span><i style="background:var(--c2)"></i>${t('spend')}</span>
    </div><div class="readout num" id="readout"></div>${s}`;
  }

  h+=`</section>`;
  const rows=GROUPS.map(k=>({k,v:gt[k]})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(rows.length)h+=`<section class="card">
    <h2>${t('r_cats')}</h2>
    ${rows.map(r=>`<div class="row">
      <span class="dot" style="background:var(--g-${r.k})"></span>
      <span class="main"><b>${t('g_'+r.k)}</b><small>${Math.round(r.v/ts*100)}%</small></span>
      <span class="amt num">${money(r.v)}</span>
    </div>`).join('')}
  </section>`;

  return h;
}

function setReadout(i){
  const el=$('#readout');if(!el)return;const x=totals(RY,i);
  el.textContent=`${dfmt(new Date(RY,i,1),{month:'long'})}: ${t('income')} ${money(x.inc)} · ${t('spend')} ${money(x.spend)}`;
  document.querySelectorAll('.chart g').forEach(g=>g.classList.toggle('sel',+g.dataset.m===i));
}
/* ---------- sheets ---------- */
const KINDS=['income','expense','housing','savings','insurance','loan','inst'];
function openForm(mode,kind,item){
  const today=ymd(new Date());
  F={mode,kind:kind||'expense',id:item?item.id:null,name:'',amount:'',date:today,cat:'other',repeat:false,end:'',every:'month',lender:'',rate:'0',months:'12',paidOff:false,paidOffDate:''};
  if(item){
    F.name=item.name;
    if(item.kind==='tx'){F.kind=item.type;F.amount=item.amount;F.date=item.date;F.cat=item.cat||'other'}
    else if(item.kind==='rec'){F.kind=item.type;F.amount=item.amount;F.date=item.start;F.end=item.end||'';F.every=item.every||'month';F.cat=item.cat||'other';F.repeat=true}
    else if(item.kind==='loan'){F.kind='loan';F.amount=item.principal;F.date=item.start;F.lender=item.lender||'';F.rate=item.rate;F.months=item.months;F.paidOff=item.paidOff;F.paidOffDate=item.paidOffDate}
    else{F.kind='inst';F.amount=item.total;F.date=item.start;F.months=item.months}
  }else if(F.kind==='loan')F.months='48';
  sheetMode='form';showSheet();
}
function formHTML(){
  const k=F.kind,edit=F.mode==='edit';
  let h=`<div class="sh-head"><h2>${edit?t('edit_entry'):t('new_entry')}</h2><button class="icon-btn" data-act="close" aria-label="${t('close')}">${ic('x')}</button></div>`;
  if(!edit)h+=`<div class="kinds">${KINDS.map(x=>`<button type="button" class="kind ${x===k?'on':''}" data-act="kind" data-v="${x}">${t('t_'+x)}</button>`).join('')}</div>`;
  const inp=(id,f,label,type,extra='')=>`<label class="fld"><span>${label}</span><input id="${id}" data-f="${f}" type="${type}" value="${esc(F[f])}" ${extra}></label>`;
  h+=inp('f-name','name',t('f_name'),'text','maxlength="60" autocomplete="off"');
  const amountLabel=k==='loan'?t('f_principal'):k==='inst'?t('f_total'):t('f_amount');
  h+=inp('f-amount','amount',amountLabel,'number','inputmode="decimal" min="0" step="0.01"');
  if(k==='loan'){
    h+=inp('f-lender','lender',t('f_lender'),'text','maxlength="80"');
    h+=`<div class="two">${inp('f-rate','rate',t('f_rate'),'number','inputmode="decimal" min="0" max="100" step="0.01"')}${inp('f-months','months',t('f_months'),'number','inputmode="numeric" min="1" max="600" step="1"')}</div>`;
  }
  if(k==='inst')h+=inp('f-months','months',t('f_months'),'number','inputmode="numeric" min="1" max="600" step="1"');
  const isRec=k==='insurance'||F.repeat;
  h+=inp('f-date','date',k==='loan'||k==='inst'?t('f_first'):isRec?t('f_start'):t('f_date'),'date');
  if(k==='expense')h+=`<label class="fld"><span>${t('f_cat')}</span><select id="f-cat" data-f="cat">${GROUPS.filter(g=>['groceries','transport','leisure','other'].includes(g)).map(g=>`<option value="${g}" ${F.cat===g?'selected':''}>${t('g_'+g)}</option>`).join('')}</select></label>`;
  if(k==='insurance')h+=`<label class="fld"><span>${t('f_every')}</span><select id="f-every" data-f="every"><option value="month" ${F.every==='month'?'selected':''}>${t('monthly')}</option><option value="year" ${F.every==='year'?'selected':''}>${t('yearly')}</option></select></label>`;
  if(['income','expense','housing','savings'].includes(k))h+=`<label class="sw"><span>${t('f_repeat')}</span><input type="checkbox" id="f-repeat" data-f="repeat" ${F.repeat?'checked':''}></label>`;
  if(isRec)h+=inp('f-end','end',t('f_end'),'date');
  if(k==='loan'||k==='inst')h+=`<div class="preview num" id="pv"></div>`;
  h+=`<div class="err" id="ferr" role="alert"></div><div class="acts2"><button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="saveform">${t('save')}</button></div>`;
  if(edit)h+=`<button class="btn danger block" style="margin-top:12px" data-act="delitem" id="delbtn">${t('del')}</button>`;
  return h;
}
function updatePreview(){
  const el=$('#pv');if(!el)return;const a=parseFloat(F.amount),n=parseInt(F.months);
  if(!(a>0)||!(n>=1)){el.innerHTML='—';return}
  if(F.kind==='loan'){const c=loanCalc(a,parseFloat(F.rate)||0,n);el.innerHTML=`<div><span>${t('p_monthly')}</span><b>${money(c.pay)}</b></div><div><span>${t('p_total')}</span><b>${money(c.total)}</b></div><div><span>${t('p_interest')}</span><b>${money(c.interest)}</b></div>`}
  else el.innerHTML=`<div><span>${t('p_monthly')}</span><b>${money(a/n)}</b></div>`;
}
function saveForm(){
  const k=F.kind,amt=parseFloat(F.amount),err=m=>{$('#ferr').textContent=m};
  const name=(F.name||'').trim()||t('t_'+k);
  if(!(amt>0))return err(t('err_amount'));
  if(!F.date)return err(t('err_date'));
  const id=F.id||uid();let item;
  if(k==='loan'||k==='inst'){
    const n=parseInt(F.months);if(!(n>=1))return err(t('err_months'));
    item=k==='loan'?{id,kind:'loan',name,lender:(F.lender||'').trim(),principal:amt,rate:Math.max(0,parseFloat(F.rate)||0),months:n,start:F.date,paidOff:!!F.paidOff,paidOffDate:F.paidOffDate||''}
                   :{id,kind:'inst',name,total:amt,months:n,start:F.date};
  }else if(k==='insurance')item={id,kind:'rec',type:'insurance',name,amount:amt,every:F.every,start:F.date,end:F.end||''};
  else{
    const cat=k==='expense'?F.cat:undefined;
    item=F.repeat?{id,kind:'rec',type:k,cat,name,amount:amt,every:'month',start:F.date,end:F.end||''}:{id,kind:'tx',type:k,cat,name,amount:amt,date:F.date};
  }
  const i=S.items.findIndex(x=>x.id===id);if(i>=0)S.items[i]=item;else S.items.push(item);
  persist();closeSheet();render();
}
function settingsHTML(){
  return `<div class="sh-head"><h2>${t('set')}</h2><button class="icon-btn" data-act="close" aria-label="${t('close')}">${ic('x')}</button></div>
  <div class="two"><label class="fld"><span>${t('lang')}</span><select id="s-lang"><option value="tr" ${S.lang==='tr'?'selected':''}>Türkçe</option><option value="de" ${S.lang==='de'?'selected':''}>Deutsch</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></label>
  <label class="fld"><span>${t('currency')}</span><select id="s-cur">${['EUR','USD','TRY','GBP','CHF'].map(c=>`<option ${S.currency===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <div class="sec" style="margin-top:18px"><h2>${t('backup')}</h2></div>
  <button class="btn block" data-act="copybk">${window.Android&&typeof window.Android.saveBackup==='function'?t('save_file'):t('copy_bk')}</button>
  ${window.Android&&typeof window.Android.pickBackup==='function'?`<button class="btn block" style="margin-top:10px" data-act="pickbk">${t('load_file')}</button>`:''}
  <label class="fld"><span>${t('paste_here')}</span><textarea id="bk" spellcheck="false"></textarea></label>
  <button class="btn block" data-act="restorebk">${t('restore')}</button>
  <button class="btn block" style="margin-top:10px" data-act="restoreprev">${t('restore_prev')}</button>
  <div class="small muted" id="bkmsg" style="min-height:22px;margin-top:8px">${esc(msg)}</div>
  <button class="btn danger block" style="margin-top:14px" data-act="reset" id="resetbtn">${t('reset')}</button>
  <p class="foot">${t('private')}<br>${t('disclaimer')}</p>`;
}
function showSheet(){$('#panel').innerHTML=sheetMode==='form'?formHTML():settingsHTML();$('#sheet').hidden=false;document.body.style.overflow='hidden';if(sheetMode==='form')updatePreview()}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';F=null;sheetMode=null;msg=''}
/* ---------- render ---------- */
function render(){
  const views={home:vHome,entries:vEntries,plan:vPlan,budget:vBudget,report:vReport};
  const brand=tab==='plan'?esc(t('nav_plan')):'My<i>Finance</i>';
  const top=`<div class="top"><div class="brand">${brand}</div><button class="icon-btn" data-act="settings" aria-label="${t('set')}">${ic('sliders')}</button></div>`;
  $('#app').innerHTML=top+views[tab]()+(tab==='home'?`<p class="foot">${t('disclaimer')}</p>`:'');
  const tabs=[['home','home'],['entries','list'],['plan','layers'],['budget','pie'],['report','chart']];
  const btn=([k,i])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}" ${tab===k?'aria-current="page"':''}>${ic(i)}<span>${t('nav_'+k)}</span></button>`;
  $('#nav').innerHTML=tabs.slice(0,2).map(btn).join('')+`<button class="addtab" data-act="add" aria-label="${t('new_entry')}">${ic('plus')}</button>`+tabs.slice(2).map(btn).join('');
  document.documentElement.lang=S.lang;
  if(tab==='report'&&!showTable)setReadout(RY===V.y?V.m:0);
}
/* ---------- events ---------- */
const moveM=d=>{const x=new Date(V.y,V.m+d,1);V.y=x.getFullYear();V.m=x.getMonth()};
function arm(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed='1';btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed}},3500)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const g=e.target.closest('.chart g[data-m]');if(g)setReadout(+g.dataset.m);return}
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  const item=id?S.items.find(x=>x.id===id):null;
  switch(a){
    case 'pdfexport':makePdfReport();break;  
    case 'tab':tab=v;render();window.scrollTo(0,0);break;
    case 'mprev':moveM(-1);RY=V.y;render();break;case 'mnext':moveM(1);RY=V.y;render();break;
    case 'yprev':RY--;render();break;case 'ynext':RY++;render();break;
    case 'filter':filter=v;render();break;
    case 'tbl':showTable=!showTable;render();break;
    case 'add':openForm('add',v==='rec'?'expense':v||(filter!=='all'&&KINDS.includes(filter)?filter:'expense'));if(v==='rec'){F.repeat=true;showSheet()}break;
    case 'edit':if(item)openForm('edit',null,item);break;
    case 'close':closeSheet();break;
    case 'settings':sheetMode='settings';showSheet();break;
    case 'kind':{const keep={name:F.name,amount:F.amount,date:F.date};F.kind=v;Object.assign(F,keep);if(v==='loan'&&F.months==='12')F.months='48';if(v!=='loan'&&F.months==='48')F.months='12';if(v==='insurance'||v==='loan'||v==='inst')F.repeat=false;showSheet();break}
    case 'saveform':saveForm();break;
    case 'delitem':arm(b,t('del_sure'),()=>{S.items=S.items.filter(x=>x.id!==F.id);persist();closeSheet();render()});break;
    case 'togglepaid':if(item){item.paidOff=!item.paidOff;item.paidOffDate=item.paidOff?ymd(new Date()):'';persist();render()}break;
    case 'cleardemo':S.items=S.items.filter(x=>!x.demo);S.goals=S.goals.filter(x=>!x.demo);S.budgets={};S.demo=false;persist();render();break;
    case 'goaladd':{const n=$('#g-name').value.trim(),tg=parseFloat($('#g-target').value),sv=parseFloat($('#g-saved').value)||0;if(!n||!(tg>0))break;S.goals.push({id:uid(),name:n,target:tg,saved:Math.max(0,sv)});persist();render();break}
    case 'goalplus':{const x=parseFloat($('#gp-'+id).value);const g=S.goals.find(q=>q.id===id);if(g&&x>0){g.saved+=x;persist();render()}break}
    case 'goaldel':arm(b,t('del_sure'),()=>{S.goals=S.goals.filter(g=>g.id!==id);persist();render()});break;
    case 'pickbk':try{window.Android.pickBackup()}catch(_){}break;
    case 'copybk':{const txt=JSON.stringify(S,null,2);
      if(window.Android&&typeof window.Android.saveBackup==='function'){try{window.Android.saveBackup(txt);break}catch(_){}}
      const done=()=>{msg=t('copied');$('#bkmsg').textContent=msg};
      const fallback=()=>{const ta=$('#bk');ta.value=txt;ta.focus();ta.select();done()};
      try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(_){fallback()}
      break}
    case 'restorebk':{try{S=parseBackup($('#bk').value);persist();closeSheet();render()}catch(_){$('#bkmsg').textContent=t('bad_bk')}break}
    case 'restoreprev':{try{const p=localStorage.getItem(KEY+'.prev');if(!p){$('#bkmsg').textContent=t('no_prev');break}const cur=localStorage.getItem(KEY);S=parseBackup(p);localStorage.setItem(KEY,JSON.stringify(S));if(cur)localStorage.setItem(KEY+'.prev',cur);closeSheet();render()}catch(_){$('#bkmsg').textContent=t('bad_bk')}break}
    case 'reset':arm(b,t('reset_sure'),()=>{const l=S.lang,c=S.currency;S={v:2,lang:l,currency:c,items:[],budgets:{},goals:[],demo:false};persist();closeSheet();render()});break;
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(f&&F){F[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(['amount','rate','months'].includes(f))updatePreview()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.f==='repeat'&&F){F.repeat=el.checked;showSheet();return}
  if(el.dataset&&el.dataset.lim){const v=parseFloat(el.value);if(v>0)S.budgets[el.dataset.lim]=v;else delete S.budgets[el.dataset.lim];persist();render();return}
  if(el.id==='s-lang'){S.lang=el.value;persist();render();showSheet();return}
  if(el.id==='s-cur'){S.currency=el.value;persist();render();showSheet()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
/* Hooks for the Android wrapper (harmless in a browser). */
window.__back=function(){if(!$('#sheet').hidden){closeSheet();return true}if(tab!=='home'){tab='home';render();window.scrollTo(0,0);return true}return false};
window.__onBackup=function(b64){
  try{const txt=new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)));S=parseBackup(txt);persist();closeSheet();render()}
  catch(_){const m=$('#bkmsg');if(m)m.textContent=t('bad_bk')}
};
load();render();
</script>
 <div id="printArea"></div>
