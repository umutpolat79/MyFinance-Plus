
name: Build MyFinance Plus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/myfinance/plus

          cp MyFinance.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyFinancePlus"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.myfinance.plus'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.myfinance.plus'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MyFinance Plus"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/myfinance/plus/MainActivity.java <<'EOF'
          package com.myfinance.plus;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebViewClient;
          import android.print.PrintManager;
          import android.print.PrintAttributes;
          import java.io.OutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              WebView web;
              static final int SAVE_BACKUP = 10;
              static final int LOAD_BACKUP = 11;
              String backupText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new AndroidBridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

                            public class AndroidBridge {

                  @JavascriptInterface
                  public void printPdf() {
                      runOnUiThread(() -> {
                          PrintManager printManager =
                              (PrintManager) getSystemService(PRINT_SERVICE);

                          android.print.PrintDocumentAdapter adapter =
                              web.createPrintDocumentAdapter("MyFinance-Plus");

                          printManager.print(
                              "MyFinance-Plus",
                              adapter,
                              new PrintAttributes.Builder()
                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                  .setResolution(new PrintAttributes.Resolution("pdf", "PDF", 300, 300))
                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                  .build()
                          );
                      });
                  }

                  @JavascriptInterface
                  public void saveBackup(String json) {
                      backupText = json;
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, "MyFinance-Plus-Backup.json");
                          startActivityForResult(intent, SAVE_BACKUP);
                      });
                  }

                  @JavascriptInterface
                  public void pickBackup() {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          startActivityForResult(intent, LOAD_BACKUP);
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK || data == null) return;

                  Uri uri = data.getData();
                  try {
                      if (requestCode == SAVE_BACKUP) {
                          OutputStream out = getContentResolver().openOutputStream(uri);
                          out.write(backupText.getBytes(StandardCharsets.UTF_8));
                          out.close();
                      } else if (requestCode == LOAD_BACKUP) {
                          InputStream in = getContentResolver().openInputStream(uri);
                          java.io.ByteArrayOutputStream buffer = new java.io.ByteArrayOutputStream();
                          byte[] bytes = new byte[4096];
                          int count;
                          while ((count = in.read(bytes)) != -1) buffer.write(bytes, 0, count);
                          in.close();
                          String b64 = Base64.encodeToString(buffer.toByteArray(), Base64.NO_WRAP);
                          web.evaluateJavascript("window.__onBackup('" + b64 + "')", null);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFinance-Plus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
